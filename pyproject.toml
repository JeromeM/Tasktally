[project]
name = "tasktally"
version = "0.1.0"
description = "Daily time tracking views and an interactive TUI on top of Taskwarrior"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tally = "tasktally.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
