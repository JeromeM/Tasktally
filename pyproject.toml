[project]
name = "task-tools"
version = "0.1.0"
description = "Daily time tracking views and an interactive TUI on top of Taskwarrior"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
task-time = "task_tools.cli:main"
tt = "task_tools.tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
