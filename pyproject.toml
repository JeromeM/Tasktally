[project]
name = "tasktally"
version = "0.1.0"
description = "Daily time tracking views and an interactive TUI on top of Taskwarrior"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jérôme Meyer" }]
keywords = ["taskwarrior", "time-tracking", "tui", "cli"]
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "typer>=0.12"]

[project.urls]
Homepage = "https://github.com/JeromeM/Tasktally"

[project.scripts]
tally = "tasktally.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
